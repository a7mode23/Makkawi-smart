<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>قدم الخير — دليل الشعار</title>
<link rel="icon" href="logo/qadam-favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;700&display=swap" rel="stylesheet">
<style>
 :root{--bg:#FBF7EF;--card:#fff;--ink:#12241F;--muted:#6d7a74;--line:#e7e1d4;--green:#0A5440}
 *{box-sizing:border-box}
 body{margin:0;background:var(--bg);color:var(--ink);font-family:"El Messiri",system-ui,sans-serif;line-height:1.8}
 .wrap{max-width:1000px;margin:0 auto;padding:44px 16px 72px}
 header{text-align:center;display:grid;gap:14px;justify-items:center}
 header img{width:min(380px,80%)}
 header p{margin:0;color:var(--muted);max-width:52ch}
 h2{font-size:20px;margin:48px 0 14px;padding-bottom:8px;border-bottom:1px solid var(--line);color:var(--green)}
 .grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
 .c{margin:0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;display:grid;gap:12px;justify-items:center;align-content:center;min-height:170px}
 .c img{max-width:100%;height:auto} .c img.sq{width:110px}
 .c.dark{background:#12241F;border-color:#12241F} .c.green{background:#0F7B5A;border-color:#0F7B5A}
 figcaption{font-size:14px;text-align:center} figcaption span{display:block;font:11px ui-monospace,monospace;color:var(--muted);direction:ltr}
 .c.dark figcaption,.c.green figcaption{color:#e9efe9} .c.dark span,.c.green span{color:#b9c9c1}
 .sw{display:flex;flex-wrap:wrap;gap:12px} .sw div{flex:1 1 140px;border-radius:12px;padding:14px;min-height:90px;display:flex;align-items:flex-end;font:12px ui-monospace,monospace;color:#fff;direction:ltr}
</style></head><body><div class="wrap">
<header><img src="logo/qadam-logo.svg" alt="قدم الخير — Qadam Alkhair">
<p><b>نقطة «الخير» قلب.</b> النقطة الوحيدة في كلمة الخير — بالعربي والإنجليزي — صارت قلباً ذهبياً. وكل الباقي خطّ بسيط هادئ.</p></header>
<h2>النسخ</h2><div class="grid"><figure class="c "><img src="logo/qadam-logo.svg" alt="الشعار الأساسي" class=""><figcaption>الشعار الأساسي<span>qadam-logo.svg</span></figcaption></figure><figure class="c "><img src="logo/qadam-logo-horizontal.svg" alt="أفقي" class=""><figcaption>أفقي<span>qadam-logo-horizontal.svg</span></figcaption></figure><figure class="c dark"><img src="logo/qadam-logo-dark.svg" alt="على الداكن" class=""><figcaption>على الداكن<span>qadam-logo-dark.svg</span></figcaption></figure><figure class="c green"><img src="logo/qadam-logo-on-green.svg" alt="على الأخضر" class=""><figcaption>على الأخضر<span>qadam-logo-on-green.svg</span></figcaption></figure><figure class="c "><img src="logo/qadam-wordmark-ar.svg" alt="عربي فقط" class=""><figcaption>عربي فقط<span>qadam-wordmark-ar.svg</span></figcaption></figure><figure class="c "><img src="logo/qadam-wordmark-en.svg" alt="إنجليزي فقط" class=""><figcaption>إنجليزي فقط<span>qadam-wordmark-en.svg</span></figcaption></figure><figure class="c icon"><img src="logo/qadam-icon.svg" alt="صورة البروفايل" class="sq"><figcaption>صورة البروفايل<span>qadam-icon.svg</span></figcaption></figure><figure class="c icon"><img src="logo/qadam-app-icon.svg" alt="أيقونة تطبيق" class="sq"><figcaption>أيقونة تطبيق<span>qadam-app-icon.svg</span></figcaption></figure><figure class="c icon"><img src="logo/qadam-favicon.svg" alt="أيقونة المتصفح" class="sq"><figcaption>أيقونة المتصفح<span>qadam-favicon.svg</span></figcaption></figure><figure class="c "><img src="logo/qadam-logo-mono-ink.svg" alt="لون واحد" class=""><figcaption>لون واحد<span>qadam-logo-mono-ink.svg</span></figcaption></figure><figure class="c "><img src="logo/qadam-alt-rounded.svg" alt="بديل · مدوّر دافئ" class=""><figcaption>بديل · مدوّر دافئ<span>qadam-alt-rounded.svg</span></figcaption></figure><figure class="c "><img src="logo/qadam-alt-ruqaa.svg" alt="بديل · رقعة" class=""><figcaption>بديل · رقعة<span>qadam-alt-ruqaa.svg</span></figcaption></figure><figure class="c "><img src="logo/qadam-alt-modern.svg" alt="بديل · عصري" class=""><figcaption>بديل · عصري<span>qadam-alt-modern.svg</span></figcaption></figure></div>
<h2>الألوان</h2><div class="sw">
<div style="background:#0A5440">Khair Green #0A5440</div><div style="background:#0F7B5A">Leaf Green #0F7B5A</div>
<div style="background:#E3A42B">Khair Gold #E3A42B</div><div style="background:#F6CB6B;color:#12241F">Light Gold #F6CB6B</div>
<div style="background:#12241F">Ink #12241F</div><div style="background:#FBF7EF;color:#12241F;border:1px solid #e7e1d4">Cream #FBF7EF</div></div>
</div></body></html>
