<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><title>قدم الخير — دليل الشعار</title>
<link rel="icon" href="logo/qadam-favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FBF7EF;--ink:#12241F;--muted:#6d7a74;--line:#e7e1d4;--green:#0A5440}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:"El Messiri",system-ui,sans-serif;line-height:1.8}
.wrap{max-width:1040px;margin:0 auto;padding:44px 16px 72px}
header{display:grid;justify-items:center;gap:14px;text-align:center} header img{width:min(460px,90%)}
header p{margin:0;color:var(--muted);max-width:56ch}
h2{font-size:20px;margin:46px 0 14px;padding-bottom:8px;border-bottom:1px solid var(--line);color:var(--green)}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.c{margin:0;background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;display:grid;gap:10px;justify-items:center;align-content:center;min-height:170px}
.c img{max-width:100%;height:auto} .c.sq img{width:120px} .c.fav img{width:48px}
.c.dark{background:#12241F;border-color:#12241F;padding:0 0 12px;overflow:hidden} .c.green{background:#0F7B5A;border-color:#0F7B5A;padding:0 0 12px;overflow:hidden}
figcaption{font-size:14px;text-align:center} figcaption span{display:block;font:11px ui-monospace,monospace;color:var(--muted);direction:ltr}
.c.dark figcaption,.c.green figcaption{color:#e9efe9} .c.dark span,.c.green span{color:#b9c9c1}
.sw{display:flex;flex-wrap:wrap;gap:12px} .sw div{flex:1 1 140px;border-radius:12px;padding:14px;min-height:90px;display:flex;align-items:flex-end;font:12px ui-monospace,monospace;color:#fff;direction:ltr}
</style></head><body><div class="wrap">
<header><img src="logo/qadam-logo.svg" alt="قدم الخير — Qadam Alkhair">
<p><b>خطوات الخير.</b> قدمان ماشيتان لقدّام ناحية الاسم، والخطوة الأمامية ذهبية: الخطوة اللي بتجيب الخير.</p></header>
<h2>النسخ</h2><div class="grid"><figure class="c "><img src="logo/qadam-logo.svg" alt="الشعار الأساسي — أفقي"><figcaption>الشعار الأساسي — أفقي<span>qadam-logo.svg</span></figcaption></figure><figure class="c "><img src="logo/qadam-logo-stacked.svg" alt="عمودي"><figcaption>عمودي<span>qadam-logo-stacked.svg</span></figcaption></figure><figure class="c dark"><img src="logo/qadam-logo-dark.svg" alt="على الداكن"><figcaption>على الداكن<span>qadam-logo-dark.svg</span></figcaption></figure><figure class="c green"><img src="logo/qadam-logo-on-green.svg" alt="على الأخضر"><figcaption>على الأخضر<span>qadam-logo-on-green.svg</span></figcaption></figure><figure class="c dark"><img src="logo/qadam-logo-stacked-dark.svg" alt="عمودي على الداكن"><figcaption>عمودي على الداكن<span>qadam-logo-stacked-dark.svg</span></figcaption></figure><figure class="c "><img src="logo/qadam-logo-mono-ink.svg" alt="لون واحد"><figcaption>لون واحد<span>qadam-logo-mono-ink.svg</span></figcaption></figure><figure class="c sq"><img src="logo/qadam-mark.svg" alt="الأيقونة وحدها"><figcaption>الأيقونة وحدها<span>qadam-mark.svg</span></figcaption></figure><figure class="c sq"><img src="logo/qadam-icon.svg" alt="صورة البروفايل"><figcaption>صورة البروفايل<span>qadam-icon.svg</span></figcaption></figure><figure class="c sq"><img src="logo/qadam-app-icon.svg" alt="أيقونة تطبيق"><figcaption>أيقونة تطبيق<span>qadam-app-icon.svg</span></figcaption></figure><figure class="c fav"><img src="logo/qadam-favicon.svg" alt="أيقونة المتصفح"><figcaption>أيقونة المتصفح<span>qadam-favicon.svg</span></figcaption></figure><figure class="c "><img src="logo/qadam-wordmark-ar.svg" alt="الاسم بالعربي"><figcaption>الاسم بالعربي<span>qadam-wordmark-ar.svg</span></figcaption></figure><figure class="c "><img src="logo/qadam-wordmark-en.svg" alt="الاسم بالإنجليزي"><figcaption>الاسم بالإنجليزي<span>qadam-wordmark-en.svg</span></figcaption></figure></div>
<h2>الألوان</h2><div class="sw">
<div style="background:#0A5440">Khair Green #0A5440</div><div style="background:#0F7B5A">Step Green #0F7B5A</div>
<div style="background:#E3A42B">Khair Gold #E3A42B</div><div style="background:#F6CB6B;color:#12241F">Light Gold #F6CB6B</div>
<div style="background:#12241F">Ink #12241F</div><div style="background:#FBF7EF;color:#12241F;border:1px solid #e7e1d4">Cream #FBF7EF</div></div>
</div></body></html>
